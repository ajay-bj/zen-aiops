# GitOps token delivered via External Secrets Operator — same pattern as the
# pharma jwt-secret / db-credentials. NO manual `kubectl create secret`, and the
# token never lives in git.
#
# Flow:
#   AWS Secrets Manager  /pharma/dev/aiops-gitops-token  (JSON: {"token": "ghp_..."})
#        │  synced by ESO via the existing ClusterSecretStore (aws-secrets-manager,
#        │  authenticated by pharma-dev-eso-role which can read /pharma/*)
#        ▼
#   K8s Secret  aiops-gitops-token  (key: GITOPS_TOKEN)  in namespace dev
#        ▼
#   consumed by the agent Deployment as env GITOPS_TOKEN
#
# One-time (documented in README): put the PAT into Secrets Manager:
#   aws secretsmanager create-secret --name /pharma/dev/aiops-gitops-token \
#     --secret-string '{"token":"ghp_your_pat_with_contents_write_on_zen-gitops-ajay"}'
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aiops-gitops-token
  namespace: dev
  labels:
    app: aiops-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: aiops-gitops-token
    creationPolicy: Owner
  data:
    - secretKey: GITOPS_TOKEN
      remoteRef:
        key: /pharma/dev/aiops-gitops-token
        property: token
