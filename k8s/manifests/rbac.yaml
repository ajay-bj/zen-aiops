# ServiceAccount (IRSA) + RBAC for the AIOps self-healing agent.
#
# Applied by ArgoCD (Application aiops-agent-dev) into the `dev` namespace of
# pharma-dev-cluster. The agent monitors the 9 pharma services and heals them.
#
# Durable remediations (image rollback, memory bump) are made by committing to the
# gitops repo — NOT by patching the live cluster — so the agent does NOT need
# permission to patch Deployments (that would fight ArgoCD selfHeal). The only live
# action it takes is deleting a crashing pod so the Deployment recreates it (ArgoCD
# does not manage individual pods, so this creates no drift).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-agent
  namespace: dev
  labels:
    app: aiops-agent
  annotations:
    # IRSA: links this SA to the AWS IAM role granting Bedrock access.
    # Role created one-time from iam/trust-policy.template.json (see README).
    eks.amazonaws.com/role-arn: arn:aws:iam::304312474711:role/pharma-dev-aiops-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiops-agent-role
  labels:
    app: aiops-agent
rules:
  # READ: incident context
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  # READ: resolve owning deployment + verify recovery
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  # WRITE: delete pods only (CrashLoop restart). No deployment patch — fixes go via git.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-agent-binding
  labels:
    app: aiops-agent
subjects:
  - kind: ServiceAccount
    name: aiops-agent
    namespace: dev
roleRef:
  kind: ClusterRole
  name: aiops-agent-role
  apiGroup: rbac.authorization.k8s.io
